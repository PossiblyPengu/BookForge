name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"
      - name: Native pure-logic regression checks
        run: ios/Checks/bookmaster/run.sh data

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Version in sync (PWA + iOS)
        run: npm run version:check

      - name: Test
        run: npm test

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r installer/requirements.txt
      - name: Compile check
        run: python -m compileall -q installer/ptinstall
      - name: Import smoke test
        working-directory: installer
        run: python -c "import ptinstall.cli, ptinstall.pipeline, ptinstall.gsa, ptinstall.provision, ptinstall.device, ptinstall.signing, ptinstall.anisette, ptinstall.release"

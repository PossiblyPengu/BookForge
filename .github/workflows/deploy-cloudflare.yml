name: Deploy to Cloudflare Pages

# Deploys happen when CI goes green on main — never before. A commit that
# fails lint/tests/version-check used to ship anyway because this ran on
# every push in parallel with CI. Manual dispatch stays as an escape hatch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      # Secrets can't sit in `if`, so they come through env: no token means a
      # skipped deploy (we ship with wrangler locally) rather than a red run.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: wrangler pages deploy docs --project-name=pageturner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Note the skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN isn't set — deploy manually: wrangler pages deploy docs --project-name=pageturner" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: ptinstall exe

on:
  push:
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

concurrency:
  group: ptinstall-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r installer/requirements.txt pyinstaller
      - name: Build single-file exe
        run: >
          pyinstaller --onefile --console --name ptinstall
          --paths installer
          --collect-all pymobiledevice3 --collect-all pytun_pmd3 --collect-all qh3
          --collect-submodules ptinstall
          --hidden-import srp._pysrp --hidden-import win32security
          --hidden-import sslpsk_pmd3
          --add-data "installer/ptinstall/apple_root_ca.pem;ptinstall"
          installer/main.py
      - name: Smoke test the exe
        run: dist\ptinstall.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: ptinstall-exe
          path: dist/ptinstall.exe
          if-no-files-found: error
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = "installer-latest"
          $exists = gh release view $release 2>$null; $ok = $LASTEXITCODE -eq 0
          if ($ok) {
            gh release upload $release dist/ptinstall.exe --clobber
          } else {
            gh release create $release dist/ptinstall.exe --title "ptinstall — latest build" --prerelease
          }

name: iOS IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen

      - name: Build unsigned app
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -project Pageturner.xcodeproj \
            -scheme Pageturner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      # xcodebuild's output is not turned into annotations, so a failed build
      # otherwise shows up as a bare "exit code 65". Put the diagnostics where
      # they can be read without downloading anything.
      - name: Report compiler diagnostics
        if: always()
        run: |
          cd ios
          {
            echo "### Swift diagnostics"
            echo
            if grep -qE "(error|warning): " xcodebuild.log; then
              echo '```'
              grep -E "(error|warning): " xcodebuild.log | sort -u | head -80
              echo '```'
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error: " xcodebuild.log | sort -u | head -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: warn

      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r Pageturner.app Payload/
          zip -qr Pageturner.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pageturner-ipa
          path: ios/build/Build/Products/Release-iphoneos/Pageturner.ipa
          if-no-files-found: error

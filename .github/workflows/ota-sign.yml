name: ota sign

# Backend for the install page (docs/install.html). The page dispatches
# `repository_dispatch` type `ota-sign` with client_payload:
#   {request_id, udid, apple_id, password, twofa?, device_name?}
# We sign headlessly and publish status-<rid>.json, manifest-<rid>.plist and
# Pageturner-<rid>.ipa onto the rolling `ota-latest` release. The page polls
# the status asset through its own function endpoint.
#
# Linux runner: the self-hosted anisette server (Dadoum/Provision) needs
# OpenSSL + libcurl, which ubuntu-latest already has; the Windows build wants
# DLLs it doesn't ship. A private ADI machine identity per run also dodges
# Apple's flagging of the shared public anisette servers.
on:
  repository_dispatch:
    types: [ota-sign]
  workflow_dispatch: {}  # smoke-test path: payload fields come from envs

permissions:
  contents: write

concurrency:
  # Never cancel: a 2FA retry is a second dispatch and must not kill the first.
  group: ota-sign
  cancel-in-progress: false

env:
  ANISETTE_VER: "2.2.0"
  ANISETTE_SHA256: "56f1a34ef86d07fca501957bcef64594f40aea5f9cdce5dac5d9d9edde3bb754"

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r installer/requirements.txt

      - name: Mask dispatched secrets in logs
        run: |
          [ -n "$OTA_PW" ] && echo "::add-mask::$OTA_PW" || true
          [ -n "$OTA_2FA" ] && echo "::add-mask::$OTA_2FA" || true
        env:
          OTA_PW: ${{ github.event.client_payload.password }}
          OTA_2FA: ${{ github.event.client_payload.twofa }}

      - name: Restore anisette + ADI identity (2FA retries reuse them)
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ github.event.client_payload.request_id }}
        run: |
          mkdir -p cache
          gh release download ota-latest -p "anisette-$RID.json" -D cache --clobber || \
            echo "no cached anisette — first run for $RID"
          gh release download ota-latest -p "adi-$RID.tar.gz" -D cache --clobber && \
            tar -xzf "cache/adi-$RID.tar.gz" -C cache || \
            echo "no cached ADI state — first run for $RID"

      - name: Start local anisette server
        run: |
          curl -fsSL -o anisette-server \
            "https://github.com/Dadoum/Provision/releases/download/$ANISETTE_VER/anisette-server-x86_64"
          echo "$ANISETTE_SHA256  anisette-server" | sha256sum -c -
          chmod +x anisette-server
          mkdir -p cache/adi
          ./anisette-server --init-only --adi-path "$PWD/cache/adi"
          nohup ./anisette-server -n 127.0.0.1 -p 16969 --adi-path "$PWD/cache/adi" \
            > anisette.log 2>&1 &
          for i in $(seq 1 24); do
            curl -sf -m 5 http://127.0.0.1:16969 > /dev/null && break
            sleep 5
          done
          curl -fsS -m 15 http://127.0.0.1:16969 || { cat anisette.log; exit 1; }

      - name: Sign
        run: |
          python installer/main.py ota-sign --out-dir out \
            --anisette remote --anisette-url "http://127.0.0.1:16969" \
            --anisette-file "cache/anisette-$PTINSTALL_OTA_REQUEST_ID.json"
          exit 0  # outcome lives in the status file, not the exit code
        env:
          PTINSTALL_OTA_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          PTINSTALL_OTA_UDID: ${{ github.event.client_payload.udid }}
          PTINSTALL_OTA_APPLE_ID: ${{ github.event.client_payload.apple_id }}
          PTINSTALL_OTA_PASSWORD: ${{ github.event.client_payload.password }}
          PTINSTALL_OTA_TWOFA: ${{ github.event.client_payload.twofa }}
          PTINSTALL_OTA_DEVICE_NAME: ${{ github.event.client_payload.device_name }}
          PTINSTALL_OTA_HOST: ${{ vars.OTA_HOST }}
          PTINSTALL_OTA_NONCE: ${{ github.event.client_payload.nonce }}

      - name: Publish artifacts to ota-latest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ github.event.client_payload.request_id }}
        run: |
          mkdir -p out
          [ -f "out/status-$RID.json" ] || \
            echo "{\"request_id\":\"$RID\",\"state\":\"failed\",\"detail\":\"runner crashed before writing status\"}" \
              > "out/status-$RID.json"
          [ -f "cache/anisette-$RID.json" ] && cp "cache/anisette-$RID.json" "out/" || true
          [ -d cache/adi ] && tar -czf "out/adi-$RID.tar.gz" -C cache adi || true
          gh release view ota-latest >/dev/null 2>&1 || \
            gh release create ota-latest --title "OTA signing output" --prerelease \
              --notes "Artifacts for the install page — named by request id."
          for f in out/*; do gh release upload ota-latest "$f" --clobber; done

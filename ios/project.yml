# XcodeGen spec — the Xcode project is generated from this, not committed.
#   brew install xcodegen && xcodegen generate
# CI (.github/workflows/ios.yml) does the same and builds an unsigned IPA.
name: Pageturner
options:
  bundleIdPrefix: io.github.possiblypengu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  # Readium's own fork (module: ReadiumZIPFoundation) — already in the
  # dependency graph through swift-toolkit, so the backup code reuses it.
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1
targets:
  Pageturner:
    type: application
    platform: iOS
    sources:
      - path: Pageturner
        excludes:
          - Info.plist
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    info:
      path: Pageturner/Info.plist
      properties:
        CFBundleDisplayName: Pageturner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # BookMaster's pair flow comes home as pageturner://link?code=…
        CFBundleURLTypes:
          - CFBundleURLName: io.github.possiblypengu.pageturner
            CFBundleURLSchemes:
              - pageturner
        # read-aloud keeps playing with the screen locked
        UIBackgroundModes:
          - audio
        # the Books folder is visible in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Audiobook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.possiblypengu.pageturner.cbz
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: HTML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.html
        # CBZ and Markdown have no system type on every iOS — declare them so
        # "Open in Pageturner" is offered for those files
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.possiblypengu.pageturner.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
              public.mime-type:
                - application/vnd.comicbook+zip
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.possiblypengu.pageturner
        MARKETING_VERSION: "2.7.0"
        CURRENT_PROJECT_VERSION: "82"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Pageturner:
    build:
      targets:
        Pageturner: all
